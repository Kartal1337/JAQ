<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAQ-AI Dashboard</title>
<style>
  :root {
    --bg:       #0f1117;
    --surface:  #1a1d27;
    --border:   #2a2d3e;
    --accent:   #7c6af7;
    --accent2:  #4fd1c5;
    --text:     #e2e8f0;
    --muted:    #64748b;
    --green:    #4ade80;
    --yellow:   #facc15;
    --red:      #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: grid;
    grid-template-rows: 48px 1fr;
    grid-template-columns: 220px 1fr 300px;
  }

  /* ── Header ── */
  header {
    grid-column: 1 / -1;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
  }
  header h1 { font-size: 16px; font-weight: 700; letter-spacing: 1px; color: var(--accent); }
  .ws-badge {
    margin-left: auto;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 99px;
    background: #1e293b;
    color: var(--muted);
  }
  .ws-badge.connected { background: #14532d; color: var(--green); }

  /* ── Panels ── */
  .panel {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-title {
    padding: 12px 16px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  /* ── Left: Agents ── */
  #agents-panel { }
  .agent-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
  }
  .dot.busy   { background: var(--yellow); animation: pulse 1s infinite; }
  .dot.idle   { background: var(--green); }
  .dot.error  { background: var(--red); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .agent-name { font-weight: 500; }
  .agent-state { margin-left: auto; font-size: 11px; color: var(--muted); }

  /* ── Center: Chat ── */
  #chat-panel {
    border-right: 1px solid var(--border);
    border-left: none;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-radius: 12px 12px 2px 12px;
  }
  .msg.agent {
    align-self: flex-start;
    background: #252a3d;
    border: 1px solid var(--border);
    border-radius: 2px 12px 12px 12px;
  }
  .msg.system {
    align-self: center;
    font-size: 11px;
    color: var(--muted);
    background: transparent;
    padding: 4px 0;
  }
  .msg-meta {
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
  }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #input-area {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  #task-input {
    flex: 1;
    background: #252a3d;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 14px;
    font-size: 13px;
    resize: none;
    outline: none;
    height: 42px;
    font-family: inherit;
  }
  #task-input:focus { border-color: var(--accent); }
  #send-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: opacity 0.15s;
  }
  #send-btn:disabled { opacity: 0.4; cursor: default; }

  /* ── Right: Log stream ── */
  #log-panel { border-right: none; }
  #log-stream {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    font-family: 'Cascadia Code', 'Consolas', monospace;
    font-size: 11px;
    color: #94a3b8;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .log-entry { line-height: 1.5; }
  .log-entry .ts { color: var(--muted); margin-right: 6px; }
  .log-entry .ev-start  { color: var(--accent2); }
  .log-entry .ev-done   { color: var(--green); }
  .log-entry .ev-error  { color: var(--red); }
  .log-entry .ev-init   { color: var(--muted); }
  .log-entry .ev-agent  { color: var(--yellow); }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>JAQ-AI</h1>
  <span style="color:var(--muted);font-size:12px">v2.0 Dashboard</span>
  <span id="ws-badge" class="ws-badge">● bağlanıyor...</span>
</header>

<!-- Sol: Ajanlar -->
<div class="panel" id="agents-panel">
  <div class="panel-title">Ajanlar</div>
  <div id="agent-list"></div>
</div>

<!-- Orta: Chat -->
<div class="panel" id="chat-panel">
  <div class="panel-title">Görev</div>
  <div id="messages"></div>
  <div id="input-area">
    <textarea id="task-input" placeholder="Görevi yaz... (Enter = gönder)" rows="1"></textarea>
    <button id="send-btn">Gönder</button>
  </div>
</div>

<!-- Sağ: Log stream -->
<div class="panel" id="log-panel">
  <div class="panel-title">Canlı Log</div>
  <div id="log-stream"></div>
</div>

<script>
const API = '';
let ws = null;
let pendingTaskId = null;
let pendingMsgEl = null;

// ── WebSocket ──────────────────────────────────────────────────────────────

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    badge('connected', '● bağlı');
    log('init', 'WebSocket bağlandı');
    // keep-alive ping her 20s
    setInterval(() => ws.readyState === 1 && ws.send('ping'), 20000);
  };

  ws.onclose = () => {
    badge('', '● bağlantı kesildi');
    log('error', 'WS kapandı — 3s sonra yeniden bağlanıyor');
    setTimeout(connectWS, 3000);
  };

  ws.onerror = () => badge('', '● hata');

  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    handleEvent(ev);
  };
}

function handleEvent(ev) {
  const ts = new Date().toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit',second:'2-digit'});

  if (ev.type === 'init') {
    renderAgents(ev.agents);
    log('init', `Init — ${Object.keys(ev.agents).length} ajan, ${ev.tasks.length} görev`);
    renderTaskHistory(ev.tasks);
  }

  else if (ev.type === 'agents_update') {
    renderAgents(ev.agents);
  }

  else if (ev.type === 'task_start') {
    log('start', `[${ev.task_id}] Görev başladı: "${truncate(ev.message, 40)}"`);
    updateAgentBusy();
  }

  else if (ev.type === 'task_done') {
    log('done', `[${ev.task_id}] ✓ ${ev.agent} tamamladı`);
    if (ev.task_id === pendingTaskId) {
      replacePending(ev.result, ev.agent);
      pendingTaskId = null;
    }
    document.getElementById('send-btn').disabled = false;
  }

  else if (ev.type === 'task_error') {
    log('error', `[${ev.task_id}] ✗ Hata: ${ev.error}`);
    if (ev.task_id === pendingTaskId) {
      replacePending(`⚠️ Hata: ${ev.error}`, 'Sistem');
      pendingTaskId = null;
    }
    document.getElementById('send-btn').disabled = false;
  }
}

// ── Agent render ───────────────────────────────────────────────────────────

function renderAgents(agents) {
  const list = document.getElementById('agent-list');
  list.innerHTML = '';
  for (const [name, state] of Object.entries(agents)) {
    const row = document.createElement('div');
    row.className = 'agent-row';
    row.innerHTML = `
      <div class="dot ${state}"></div>
      <span class="agent-name">${shortName(name)}</span>
      <span class="agent-state">${state}</span>
    `;
    list.appendChild(row);
  }
}

function updateAgentBusy() {
  const dots = document.querySelectorAll('.dot');
  dots.forEach(d => { d.className = 'dot busy'; d.nextElementSibling.nextElementSibling.textContent = 'busy'; });
}

function shortName(n) {
  return n.replace('Agent','').replace('Analysis',' Analiz');
}

// ── Chat render ────────────────────────────────────────────────────────────

function appendMsg(text, type, meta='') {
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = `msg ${type}`;
  el.innerHTML = escHtml(text);
  if (meta) {
    const m = document.createElement('div');
    m.className = 'msg-meta';
    m.textContent = meta;
    el.appendChild(m);
  }
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
  return el;
}

function appendSpinner(label) {
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'msg agent';
  el.innerHTML = `<span class="spinner"></span> ${escHtml(label)}`;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
  return el;
}

function replacePending(text, agentName) {
  if (!pendingMsgEl) return;
  pendingMsgEl.className = 'msg agent';
  pendingMsgEl.innerHTML = escHtml(text);
  const m = document.createElement('div');
  m.className = 'msg-meta';
  m.textContent = `${agentName} · ${new Date().toLocaleTimeString('tr-TR')}`;
  pendingMsgEl.appendChild(m);
  document.getElementById('messages').scrollTop = 9999;
  pendingMsgEl = null;
}

function renderTaskHistory(tasks) {
  const done = tasks.filter(t => t.status === 'done').slice(-3);
  if (done.length === 0) return;
  appendMsg('— önceki oturum —', 'system');
  done.forEach(t => {
    appendMsg(t.message, 'user');
    if (t.result) appendMsg(t.result, 'agent', t.agent || '');
  });
}

// ── Send task ──────────────────────────────────────────────────────────────

async function sendTask() {
  const input = document.getElementById('task-input');
  const btn = document.getElementById('send-btn');
  const msg = input.value.trim();
  if (!msg) return;

  input.value = '';
  btn.disabled = true;
  appendMsg(msg, 'user');
  pendingMsgEl = appendSpinner('Ajanlar çalışıyor...');

  try {
    const res = await fetch(`${API}/task`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg }),
    });
    const data = await res.json();
    pendingTaskId = data.task_id;
    log('start', `Task ID: ${data.task_id}`);
  } catch(err) {
    replacePending(`Bağlantı hatası: ${err.message}`, 'Sistem');
    btn.disabled = false;
  }
}

// ── Log stream ─────────────────────────────────────────────────────────────

function log(type, text) {
  const stream = document.getElementById('log-stream');
  const el = document.createElement('div');
  el.className = 'log-entry';
  const ts = new Date().toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const cls = {start:'ev-start',done:'ev-done',error:'ev-error',init:'ev-init',agent:'ev-agent'}[type] || '';
  el.innerHTML = `<span class="ts">${ts}</span><span class="${cls}">${escHtml(text)}</span>`;
  stream.appendChild(el);
  stream.scrollTop = stream.scrollHeight;
  // Max 200 satır tut
  while (stream.children.length > 200) stream.removeChild(stream.firstChild);
}

function badge(cls, text) {
  const b = document.getElementById('ws-badge');
  b.className = `ws-badge ${cls}`;
  b.textContent = text;
}

// ── Utils ──────────────────────────────────────────────────────────────────

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>');
}

function truncate(s, n) {
  return s.length > n ? s.slice(0, n) + '…' : s;
}

// ── Init ───────────────────────────────────────────────────────────────────

document.getElementById('send-btn').addEventListener('click', sendTask);
document.getElementById('task-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTask(); }
});

connectWS();
</script>
</body>
</html>
